<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fbf">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' http://localhost https://localhost capacitor://localhost">
  <title>MyDocs</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-bar">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6 2h9l5 5v15H6V2Zm8 1.5V8h4.5L14 3.5ZM9 12h8v1.5H9V12Zm0 3h8v1.5H9V15Z"/></svg>
    <h1>MyDocs</h1>
    <label class="search" title="Search is coming soon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
      <span class="visually-hidden">Search documents</span>
      <input type="search" placeholder="Search (coming soon)" disabled>
    </label>
  </header>

  <main>
    <div id="banner" class="banner" role="status" hidden></div>

    <section id="dashboard-view" aria-label="Dashboard">
      <div class="welcome">
        <h2>Welcome to MyDocs</h2>
        <p>All your important documents in one place.</p>
      </div>
      <div id="categories" class="category-grid"></div>
    </section>

    <section id="category-view" aria-labelledby="cv-title" hidden>
      <div class="cv-header">
        <button type="button" class="back-btn" id="cv-back" aria-label="Back to dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
        </button>
        <span class="category-icon" id="cv-icon"></span>
        <div class="cv-titles">
          <h2 id="cv-title"></h2>
          <p id="cv-count"></p>
        </div>
        <button type="button" class="btn filled" id="cv-add">Add document</button>
      </div>
      <div id="cv-docs"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="name-dialog" aria-labelledby="nd-title">
    <form id="name-form" novalidate>
      <h3 id="nd-title">Document name</h3>
      <p id="nd-file" class="nd-file" hidden></p>
      <label for="nd-input">Document Name</label>
      <input id="nd-input" type="text" maxlength="120" autocomplete="off" placeholder="e.g., My Aadhaar Card" aria-describedby="nd-error">
      <p id="nd-error" class="field-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn text" id="nd-cancel">Cancel</button>
        <button type="submit" class="btn filled" id="nd-save">Save Document</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
