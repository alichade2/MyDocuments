<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fbf">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' http://localhost https://localhost capacitor://localhost">
  <title>MyDocs</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-bar" id="app-bar">
    <button type="button" class="hdr-btn" id="menu-open" aria-label="Open navigation menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 18h18v-2H3v2Zm0-5h18v-2H3v2Zm0-7v2h18V6H3Z"/></svg>
    </button>
    <button type="button" class="hdr-btn" id="page-back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
    </button>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6 2h9l5 5v15H6V2Zm8 1.5V8h4.5L14 3.5ZM9 12h8v1.5H9V12Zm0 3h8v1.5H9V15Z"/></svg>
      <h1 id="app-title">MyDocs</h1>
    </div>
    <button type="button" class="share-files-btn" id="share-files" aria-label="Share selected files as a ZIP" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A2.99 2.99 0 0 0 6 9a3 3 0 1 0 0 6c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92Z"/></svg>
      <span>Share Files</span>
    </button>
    <button type="button" class="hdr-btn" id="search-open" aria-label="Search documents" aria-expanded="false" aria-controls="search-bar">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
    </button>
    <form class="search-bar" id="search-bar" role="search" novalidate hidden>
      <button type="button" class="hdr-btn" id="search-close" aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
      </button>
      <input id="search-input" type="search" placeholder="Search by name or date" aria-label="Search documents by name or date" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="hdr-btn" id="search-clear" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4Z"/></svg>
      </button>
    </form>
  </header>

  <div id="scroller" class="scroller">
  <main>
    <div id="banner" class="banner" role="status" hidden></div>

    <section id="dashboard-view" aria-label="Dashboard">
      <div class="welcome">
        <h2>Welcome to MyDocs</h2>
        <p>All your important documents in one place.</p>
      </div>
      <div id="categories" class="category-grid"></div>
    </section>

    <section id="search-view" aria-label="Search results" hidden>
      <p id="search-status" class="search-status" role="status" aria-live="polite"></p>
      <ul id="search-results" class="results"></ul>
    </section>

    <section id="category-view" aria-labelledby="cv-title" hidden>
      <div class="cv-header">
        <button type="button" class="back-btn" id="cv-back" aria-label="Back to dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
        </button>
        <span class="category-icon" id="cv-icon"></span>
        <div class="cv-titles">
          <h2 id="cv-title"></h2>
          <p id="cv-count"></p>
        </div>
      </div>
      <div class="cv-actions">
        <button type="button" class="btn filled" id="cv-add">Add document</button>
        <button type="button" class="btn outlined" id="cv-camera">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
          <span>Capture with Camera</span>
        </button>
      </div>
      <div id="cv-docs"></div>
    </section>
  </main>
  </div>

  <div id="all-scroller" class="scroller" hidden>
    <main>
      <section id="all-view" aria-label="All documents">
        <div class="selection-bar">
          <span id="sel-count" role="status" aria-live="polite">0 selected</span>
          <button type="button" class="btn text" id="sel-clear" disabled>Clear</button>
        </div>
        <div id="all-list"></div>
      </section>
    </main>
  </div>

  <div id="settings-scroller" class="scroller" hidden>
    <main>
      <section id="settings-view" aria-label="Settings">
        <div id="settings-list"></div>
      </section>
    </main>
  </div>

  <nav class="tab-bar" aria-label="Main sections">
    <button type="button" class="tab active" id="tab-category" data-tab="category" aria-current="page">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 3h8v8H3V3Zm10 0h8v8h-8V3ZM3 13h8v8H3v-8Zm10 0h8v8h-8v-8Z"/></svg></span>
      <span class="tab-label">Category</span>
    </button>
    <button type="button" class="tab" id="tab-all" data-tab="all">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 5h2v2H3V5Zm4 0h14v2H7V5ZM3 11h2v2H3v-2Zm4 0h14v2H7v-2ZM3 17h2v2H3v-2Zm4 0h14v2H7v-2Z"/></svg></span>
      <span class="tab-label">All Documents</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="name-dialog" aria-labelledby="nd-title">
    <form id="name-form" novalidate>
      <h3 id="nd-title">Document name</h3>
      <p id="nd-file" class="nd-file" hidden></p>
      <label for="nd-input">Document Name</label>
      <input id="nd-input" type="text" maxlength="120" autocomplete="off" placeholder="e.g., My Aadhaar Card" aria-describedby="nd-error">
      <p id="nd-error" class="field-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn text" id="nd-cancel">Cancel</button>
        <button type="submit" class="btn filled" id="nd-save">Save Document</button>
      </div>
    </form>
  </dialog>

  <dialog id="preview-dialog" aria-labelledby="pv-title">
    <h3 id="pv-title">Check your photo</h3>
    <img id="pv-img" alt="Preview of the captured document">
    <div class="dialog-actions pv-actions">
      <button type="button" class="btn text" id="pv-cancel">Cancel</button>
      <button type="button" class="btn outlined" id="pv-retake">Retake</button>
      <button type="button" class="btn filled" id="pv-continue">Continue</button>
    </div>
  </dialog>

  <dialog id="viewer-dialog" aria-labelledby="vw-title">
    <div class="vw-bar">
      <h3 id="vw-title"></h3>
      <button type="button" class="btn text vw-close" id="vw-close">Close</button>
    </div>
    <img id="vw-img" alt="">
  </dialog>

  <div id="drawer-scrim" class="drawer-scrim" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Navigation menu" hidden>
    <div class="drawer-head">
      <span class="drawer-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6 2h9l5 5v15H6V2Zm8 1.5V8h4.5L14 3.5ZM9 12h8v1.5H9V12Zm0 3h8v1.5H9V15Z"/></svg></span>
      <div class="drawer-titles">
        <p class="drawer-name">MyDocs</p>
        <p class="drawer-sub">Your personal document manager</p>
      </div>
    </div>
    <nav aria-label="Menu"><ul id="drawer-items" class="drawer-items"></ul></nav>
  </aside>

  <dialog id="progress-dialog" class="progress-dialog" aria-labelledby="pg-text">
    <span class="spinner" aria-hidden="true"></span>
    <p id="pg-text" role="status">Preparing ZIP file...</p>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
